<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-label="explorações de símbolo churrasquin"><title>Prancha · explorações de símbolo · direção B</title><rect width="1600" height="1120" fill="#EFE8DC"/>
<text x="40" y="70" font-family="IBM Plex Mono" font-size="14" letter-spacing="2" fill="#E0431B">PRANCHA 03A — SÍMBOLO · EXPLORAÇÕES</text><text x="40" y="118" font-family="Instrument Serif, serif" font-size="44" fill="#141110">Oito caminhos para o símbolo — miniatura de ~16px no canto de cada um.</text><g transform="translate(40,150)"><rect width="360" height="440" fill="#E6DECF" stroke="#8A8276" stroke-width="0.8"/><g transform="translate(80,40)"><rect x="20" y="50" width="160" height="100" fill="#141110"/><line x1="70" y1="40" x2="64" y2="160" stroke="#E6DECF" stroke-width="6"/><line x1="120" y1="40" x2="114" y2="160" stroke="#E6DECF" stroke-width="6"/><line x1="10" y1="100" x2="190" y2="100" stroke="#E6DECF" stroke-width="6"/>
<circle cx="128" cy="86" r="40" fill="#E6DECF"/><circle cx="128" cy="86" r="32" fill="#141110"/><path d="M128 54A32 32 0 0 1 160 86H128Z" fill="#E0431B"/><line x1="96" y1="86" x2="160" y2="86" stroke="#E6DECF" stroke-width="5"/></g><text x="20" y="300" font-family="IBM Plex Mono" font-size="13" fill="#E0431B">01</text><text x="20" y="334" font-family="Instrument Serif, serif" font-size="28" fill="#141110">Lupa · o botão "i"</text><text x="20" y="366" font-family="Inter Tight, sans-serif" font-size="14" fill="#8A8276">Conta o zoom, não a partilha. Lê-se como</text><text x="20" y="386" font-family="Inter Tight, sans-serif" font-size="14" fill="#8A8276">busca genérica.</text><g transform="translate(316,16) scale(.12)"><rect x="20" y="50" width="160" height="100" fill="#141110"/><line x1="70" y1="40" x2="64" y2="160" stroke="#E6DECF" stroke-width="6"/><line x1="120" y1="40" x2="114" y2="160" stroke="#E6DECF" stroke-width="6"/><line x1="10" y1="100" x2="190" y2="100" stroke="#E6DECF" stroke-width="6"/>
<circle cx="128" cy="86" r="40" fill="#E6DECF"/><circle cx="128" cy="86" r="32" fill="#141110"/><path d="M128 54A32 32 0 0 1 160 86H128Z" fill="#E0431B"/><line x1="96" y1="86" x2="160" y2="86" stroke="#E6DECF" stroke-width="5"/></g></g><g transform="translate(430,150)"><rect width="360" height="440" fill="#E6DECF" stroke="#8A8276" stroke-width="0.8"/><g transform="translate(80,40)"><circle cx="100" cy="100" r="46" fill="#141110"/><line x1="100" y1="50" x2="100" y2="150" stroke="#E6DECF" stroke-width="6"/><line x1="54" y1="100" x2="146" y2="100" stroke="#E6DECF" stroke-width="6"/><rect x="162.0" y="92.0" width="16" height="16" fill="#E0431B"/><rect x="141.5" y="141.5" width="16" height="16" fill="#141110"/><rect x="92.1" y="162.0" width="16" height="16" fill="#141110"/><rect x="42.6" y="141.6" width="16" height="16" fill="#141110"/><rect x="22.0" y="92.1" width="16" height="16" fill="#141110"/><rect x="42.4" y="42.6" width="16" height="16" fill="#141110"/><rect x="91.8" y="22.0" width="16" height="16" fill="#141110"/><rect x="141.4" y="42.4" width="16" height="16" fill="#141110"/></g><text x="20" y="300" font-family="IBM Plex Mono" font-size="13" fill="#E0431B">02</text><text x="20" y="334" font-family="Instrument Serif, serif" font-size="28" fill="#141110">Mesa redonda · lugares</text><text x="20" y="366" font-family="Inter Tight, sans-serif" font-size="14" fill="#8A8276">A turma fica clara; a carne some. Vira</text><text x="20" y="386" font-family="Inter Tight, sans-serif" font-size="14" fill="#8A8276">ícone de reunião.</text><g transform="translate(316,16) scale(.12)"><circle cx="100" cy="100" r="46" fill="#141110"/><line x1="100" y1="50" x2="100" y2="150" stroke="#E6DECF" stroke-width="6"/><line x1="54" y1="100" x2="146" y2="100" stroke="#E6DECF" stroke-width="6"/><rect x="162.0" y="92.0" width="16" height="16" fill="#E0431B"/><rect x="141.5" y="141.5" width="16" height="16" fill="#141110"/><rect x="92.1" y="162.0" width="16" height="16" fill="#141110"/><rect x="42.6" y="141.6" width="16" height="16" fill="#141110"/><rect x="22.0" y="92.1" width="16" height="16" fill="#141110"/><rect x="42.4" y="42.6" width="16" height="16" fill="#141110"/><rect x="91.8" y="22.0" width="16" height="16" fill="#141110"/><rect x="141.4" y="42.4" width="16" height="16" fill="#141110"/></g></g><g transform="translate(820,150)"><rect width="360" height="440" fill="#E6DECF" stroke="#8A8276" stroke-width="0.8"/><g transform="translate(80,40)"><path d="M150 62A58 58 0 1 0 150 138" fill="none" stroke="#141110" stroke-width="34"/><line x1="40" y1="40" x2="70" y2="90" stroke="#E6DECF" stroke-width="6"/><line x1="20" y1="120" x2="70" y2="110" stroke="#E6DECF" stroke-width="6"/><path d="M150 62L136 72A40 40 0 0 0 132 66Z" fill="#E0431B"/></g><text x="20" y="300" font-family="IBM Plex Mono" font-size="13" fill="#E0431B">03</text><text x="20" y="334" font-family="Instrument Serif, serif" font-size="28" fill="#141110">Monograma c seccionado</text><text x="20" y="366" font-family="Inter Tight, sans-serif" font-size="14" fill="#8A8276">Bonito, mas repete o anel rejeitado e</text><text x="20" y="386" font-family="Inter Tight, sans-serif" font-size="14" fill="#8A8276">duplica o lettering.</text><g transform="translate(316,16) scale(.12)"><path d="M150 62A58 58 0 1 0 150 138" fill="none" stroke="#141110" stroke-width="34"/><line x1="40" y1="40" x2="70" y2="90" stroke="#E6DECF" stroke-width="6"/><line x1="20" y1="120" x2="70" y2="110" stroke="#E6DECF" stroke-width="6"/><path d="M150 62L136 72A40 40 0 0 0 132 66Z" fill="#E0431B"/></g></g><g transform="translate(1210,150)"><rect width="360" height="440" fill="#E6DECF" stroke="#8A8276" stroke-width="0.8"/><g transform="translate(80,40)"><rect x="30" y="40" width="18" height="120" fill="#141110"/><rect x="60" y="40" width="18" height="120" fill="#141110"/><rect x="90" y="40" width="18" height="120" fill="#141110"/><rect x="120" y="40" width="18" height="120" fill="#E0431B"/><rect x="150" y="40" width="18" height="120" fill="#141110"/><rect x="20" y="96" width="160" height="6" fill="#E6DECF"/></g><text x="20" y="300" font-family="IBM Plex Mono" font-size="13" fill="#E0431B">04</text><text x="20" y="334" font-family="Instrument Serif, serif" font-size="28" fill="#141110">Grelha · barras = cortes</text><text x="20" y="366" font-family="Inter Tight, sans-serif" font-size="14" fill="#8A8276">Fala de brasa, não de conhecimento.</text><text x="20" y="386" font-family="Inter Tight, sans-serif" font-size="14" fill="#8A8276">Próximo do clichê.</text><g transform="translate(316,16) scale(.12)"><rect x="30" y="40" width="18" height="120" fill="#141110"/><rect x="60" y="40" width="18" height="120" fill="#141110"/><rect x="90" y="40" width="18" height="120" fill="#141110"/><rect x="120" y="40" width="18" height="120" fill="#E0431B"/><rect x="150" y="40" width="18" height="120" fill="#141110"/><rect x="20" y="96" width="160" height="6" fill="#E6DECF"/></g></g><g transform="translate(40,630)"><rect width="360" height="440" fill="#E6DECF" stroke="#8A8276" stroke-width="0.8"/><g transform="translate(80,40)"><path d="M100 170L58 110A50 50 0 1 1 142 110Z" fill="#141110"/><line x1="80" y1="30" x2="72" y2="180" stroke="#E6DECF" stroke-width="6"/><line x1="122" y1="30" x2="114" y2="180" stroke="#E6DECF" stroke-width="6"/><path d="M101 38A52 52 0 0 1 118 41L112 128L101 152Z" fill="#E0431B"/></g><text x="20" y="300" font-family="IBM Plex Mono" font-size="13" fill="#E0431B">05</text><text x="20" y="334" font-family="Instrument Serif, serif" font-size="28" fill="#141110">Pino de região</text><text x="20" y="366" font-family="Inter Tight, sans-serif" font-size="14" fill="#8A8276">Mapa sim, mas é a linguagem de app de</text><text x="20" y="386" font-family="Inter Tight, sans-serif" font-size="14" fill="#8A8276">entrega.</text><g transform="translate(316,16) scale(.12)"><path d="M100 170L58 110A50 50 0 1 1 142 110Z" fill="#141110"/><line x1="80" y1="30" x2="72" y2="180" stroke="#E6DECF" stroke-width="6"/><line x1="122" y1="30" x2="114" y2="180" stroke="#E6DECF" stroke-width="6"/><path d="M101 38A52 52 0 0 1 118 41L112 128L101 152Z" fill="#E0431B"/></g></g><g transform="translate(430,630)"><rect width="360" height="440" fill="#E6DECF" stroke="#8A8276" stroke-width="0.8"/><g transform="translate(80,40)"><path d="M30 60H150L178 100L150 140H30Z" fill="#141110"/><circle cx="150" cy="100" r="8" fill="#E6DECF"/><text x="44" y="116" font-family="IBM Plex Mono" font-size="44" fill="#E0431B">07</text></g><text x="20" y="300" font-family="IBM Plex Mono" font-size="13" fill="#E0431B">06</text><text x="20" y="334" font-family="Instrument Serif, serif" font-size="28" fill="#141110">Etiqueta numerada</text><text x="20" y="366" font-family="Inter Tight, sans-serif" font-size="14" fill="#8A8276">Sistema ótimo (já existe nos posts);</text><text x="20" y="386" font-family="Inter Tight, sans-serif" font-size="14" fill="#8A8276">fraca como marca, morre a 16px.</text><g transform="translate(316,16) scale(.12)"><path d="M30 60H150L178 100L150 140H30Z" fill="#141110"/><circle cx="150" cy="100" r="8" fill="#E6DECF"/><text x="44" y="116" font-family="IBM Plex Mono" font-size="44" fill="#E0431B">07</text></g></g><g transform="translate(820,630)"><rect width="360" height="440" fill="#E6DECF" stroke="#8A8276" stroke-width="0.8"/><g transform="translate(80,40)"><path d="M24 60H150A26 26 0 0 1 176 86V114A26 26 0 0 1 150 140H24Z" fill="#141110"/><circle cx="156" cy="100" r="8" fill="#E6DECF"/><line x1="62" y1="50" x2="58" y2="150" stroke="#E6DECF" stroke-width="6"/><line x1="96" y1="50" x2="92" y2="150" stroke="#E6DECF" stroke-width="6"/><polygon points="99,60 126,60 122,140 95,140" fill="#E0431B"/></g><text x="20" y="300" font-family="IBM Plex Mono" font-size="13" fill="#E0431B">07</text><text x="20" y="334" font-family="Instrument Serif, serif" font-size="28" fill="#141110">Tábua compartilhada</text><text x="20" y="366" font-family="Inter Tight, sans-serif" font-size="14" fill="#8A8276">Partilha e corte, mas o furo puxa para</text><text x="20" y="386" font-family="Inter Tight, sans-serif" font-size="14" fill="#8A8276">utensílio.</text><g transform="translate(316,16) scale(.12)"><path d="M24 60H150A26 26 0 0 1 176 86V114A26 26 0 0 1 150 140H24Z" fill="#141110"/><circle cx="156" cy="100" r="8" fill="#E6DECF"/><line x1="62" y1="50" x2="58" y2="150" stroke="#E6DECF" stroke-width="6"/><line x1="96" y1="50" x2="92" y2="150" stroke="#E6DECF" stroke-width="6"/><polygon points="99,60 126,60 122,140 95,140" fill="#E0431B"/></g></g><g transform="translate(1210,630)"><rect width="360" height="440" fill="#EFE8DC" stroke="#E0431B" stroke-width="2"/><g transform="translate(80,40)"><g transform="translate(-4,10) scale(1.5)"><path d="M12,22H100A24 24 0 0 1 124,46V98H36A24 24 0 0 1 12,74Z" fill="#141110"/><path d="M54,22H88L83,98H49Z" fill="#E0431B"/><line x1="54.8" y1="10" x2="48.2" y2="110" stroke="#EFE8DC" stroke-width="6"/><line x1="88.8" y1="10" x2="82.2" y2="110" stroke="#EFE8DC" stroke-width="6"/><line x1="0" y1="58" x2="52" y2="58" stroke="#EFE8DC" stroke-width="6"/></g></g><text x="20" y="300" font-family="IBM Plex Mono" font-size="13" fill="#E0431B">08 · ESCOLHIDO</text><text x="20" y="334" font-family="Instrument Serif, serif" font-size="28" fill="#141110">Peça-mapa repartida</text><text x="20" y="366" font-family="Inter Tight, sans-serif" font-size="14" fill="#8A8276">A peça inteira, dividida em regiões; uma</text><text x="20" y="386" font-family="Inter Tight, sans-serif" font-size="14" fill="#8A8276">em brasa. Mapa + corte + turma.</text><g transform="translate(316,16) scale(.12)"><g transform="translate(-4,10) scale(1.5)"><path d="M12,22H100A24 24 0 0 1 124,46V98H36A24 24 0 0 1 12,74Z" fill="#141110"/><path d="M54,22H88L83,98H49Z" fill="#E0431B"/><line x1="54.8" y1="10" x2="48.2" y2="110" stroke="#E6DECF" stroke-width="6"/><line x1="88.8" y1="10" x2="82.2" y2="110" stroke="#E6DECF" stroke-width="6"/><line x1="0" y1="58" x2="52" y2="58" stroke="#E6DECF" stroke-width="6"/></g></g></g></svg>